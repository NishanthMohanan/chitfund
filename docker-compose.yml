# Local development services. On Windows without Docker, use a local PostgreSQL 16
# service and Memurai instead (see docs/local-setup.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: chitfund-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chitfund
      POSTGRES_USER: chitfund
      POSTGRES_PASSWORD: chitfund-local-only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chitfund -d chitfund']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chitfund-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: chitfund-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
