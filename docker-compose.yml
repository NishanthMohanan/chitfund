# Local development services. On Windows without Docker, use a local PostgreSQL 16
# service and Memurai instead (see docs/local-setup.md).
# Every value comes from the root .env, which Docker Compose reads automatically.
services:
  postgres:
    image: postgres:16-alpine
    container_name: chitfund-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?Set POSTGRES_TEST_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chitfund-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:?Set REDIS_PORT in .env}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: chitfund-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:?Set MAILPIT_SMTP_PORT in .env}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:?Set MAILPIT_UI_PORT in .env}:8025'

volumes:
  postgres_data:
